name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish "Steam Desktop Authenticator/Steam Desktop Authenticator.csproj" -c Release -r win-x64 --self-contained false -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Steam-Desktop-Authenticator
          path: publish/

      - name: Zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "Steam.Desktop.Authenticator.${{ github.ref_name }}.zip"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: Steam.Desktop.Authenticator.${{ github.ref_name }}.zip
          body: |
            Fixes "Something went wrong: Exception of type 'System.Exception' was thrown" in View Confirmations.
            When Steam rejects the session, SDA now refreshes the access token and retries, and offers to log in again if that does not help.

            Install: close SDA, extract the zip over your existing SDA folder (keep the maFiles folder). Requires the .NET 8 Desktop Runtime (x64).
